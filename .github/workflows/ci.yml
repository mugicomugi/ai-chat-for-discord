name: ci

# Base images are pinned by digest; Dependabot's weekly docker PRs are how they get refreshed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Overrides the single-job setting in .cargo/config.toml, which exists for small local hosts.
  CARGO_BUILD_JOBS: 4
  # Keep in sync with the Dockerfile build image and Cargo.toml rust-version.
  RUST_TOOLCHAIN: "1.98"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TEST_DATABASE_URL: mysql://test:test_only_password@127.0.0.1:33316/discussion_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and mock-API tests
        run: cargo test --locked
      # The documented fallback for hosts that cannot build the PDF parser (scripts/build-image.sh --no-pdf).
      - name: Tests without PDF support
        run: cargo test --locked --no-default-features
      # Same disposable database and server flags as local runs (compose.test.yaml). The two
      # database tests share state and must run in order with a server restart between them.
      - name: Start test database
        run: docker compose -f compose.test.yaml -p discussion-bot-test up -d --wait
      - name: Database lifecycle test
        run: cargo test --locked --test database database_lifecycle -- --ignored --exact
      - name: Restart test database
        run: |
          docker compose -f compose.test.yaml -p discussion-bot-test restart db-test
          docker compose -f compose.test.yaml -p discussion-bot-test up -d --wait
      - name: Persistence after restart test
        run: cargo test --locked --test database persistence_after_restart -- --ignored --exact
      - name: Guild access test
        run: cargo test --locked --test database access_and_guilds -- --ignored --exact
      - name: Concurrent role settings test
        run: cargo test --locked --test database guild_role_writes_are_serialized -- --ignored --exact
      - name: Web session test
        run: cargo test --locked --test web web_sessions -- --ignored --exact
      - name: Concurrent web login test
        run: cargo test --locked --test web concurrent_logins_of_one_user_all_succeed -- --ignored --exact
      - name: Health check test
        run: cargo test --locked --test web healthz_reports_database_and_gateway -- --ignored --exact
      - name: Web login test
        run: cargo test --locked --test web web_login_keeps_only_allowlisted_guilds -- --ignored --exact
      - name: Web role settings test
        run: cargo test --locked --test web web_role_settings -- --ignored --exact
      - name: Knowledge vector search test
        run: cargo test --locked --test knowledge knowledge_vectors -- --ignored --exact
      - name: Knowledge quota test
        run: cargo test --locked --test knowledge knowledge_quotas -- --ignored --exact
      - name: Knowledge ingestion test
        run: cargo test --locked --test knowledge knowledge_ingest -- --ignored --exact
      - name: Knowledge worker failover and backfill test
        run: cargo test --locked --test knowledge knowledge_worker_failover_and_backfill -- --ignored --exact
      - name: Knowledge worker restart and rate limit test
        run: cargo test --locked --test knowledge knowledge_worker_restart_and_rate_limits -- --ignored --exact
      - name: Knowledge worker failure and deletion test
        run: cargo test --locked --test knowledge knowledge_worker_failures_and_deletion -- --ignored --exact
      - name: Knowledge search provider choice test
        run: cargo test --locked --test knowledge knowledge_search_prefers_complete_providers -- --ignored --exact
      - name: Knowledge worker retry after rejection test
        run: cargo test --locked --test knowledge knowledge_worker_retries_a_rejected_document -- --ignored --exact
      - name: Knowledge worker rate-limited provider test
        run: cargo test --locked --test knowledge knowledge_worker_waits_for_a_rate_limited_provider -- --ignored --exact
      - name: Knowledge worker guild turns test
        run: cargo test --locked --test knowledge knowledge_worker_lets_guilds_take_turns -- --ignored --exact
      - name: Knowledge vector pruning test
        run: cargo test --locked --test knowledge knowledge_prune_embeddings -- --ignored --exact
      - name: Knowledge web API test
        run: cargo test --locked --test web knowledge_web_api -- --ignored --exact
      - name: Web chat test
        run: cargo test --locked --test chat web_chat -- --ignored --exact
      - name: Web chat knowledge test
        run: cargo test --locked --test chat web_chat_knowledge_notices -- --ignored --exact
      - name: Web chat stop test
        run: cargo test --locked --test chat web_chat_stops_with_partial_text -- --ignored --exact
      # Marks every streaming answer interrupted (as at startup), so it runs alone.
      - name: Web chat retention and recovery test
        run: cargo test --locked --test chat web_chat_retention_and_recovery -- --ignored --exact
      # Uses the vectors knowledge_vectors leaves behind; backups depend on this (scripts/backup.sh).
      - name: VECTOR backup round trip (mariadb-dump --hex-blob)
        run: scripts/check-vector-dump.sh
      - name: Privacy erasure and guild purge test
        run: cargo test --locked --test web privacy_and_guild_purge -- --ignored --exact

  # The production VM (1 GB) compiles the image itself with one job: report the peak memory of
  # such a build, so new dependencies (pdf-extract and lopdf in M3) can be judged before merging.
  build-memory:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Release build with one job
        run: |
          /usr/bin/time -v cargo build --locked --release -j1 2> build-time.log || { cat build-time.log; exit 1; }
          # The largest single compiler process, as on the VM.
          peak=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' build-time.log)
          echo "Peak memory of one rustc process: $((peak / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

  # Pull requests (including Dependabot base-image bumps) build the runtime image without pushing.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          build-args: |
            CARGO_BUILD_JOBS=4
          cache-from: type=gha

  image:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            CARGO_BUILD_JOBS=4
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deployment reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### Deploy"
            echo
            echo "Check out commit ${GITHUB_SHA} on the VM, then deploy this image:"
            echo
            echo '```'
            echo "sudo scripts/deploy.sh ghcr.io/${REPOSITORY}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
