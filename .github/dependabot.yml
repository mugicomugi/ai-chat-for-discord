version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Refreshes the digest-pinned base images in the Dockerfile (security fixes).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Rust version is bumped by hand together with RUST_TOOLCHAIN in ci.yml and
      # rust-version in Cargo.toml; only digest refreshes of rust:1.98-trixie come through here.
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Refreshes the digest-pinned images in compose.yaml (Caddy) and compose.test.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MariaDB upgrades need the procedure in docs/runbook.md; only patch releases and digest
      # refreshes come through here (keep compose.yaml and compose.test.yaml in step).
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The browser libraries vendored in static/vendor/ (DOMPurify is the web UI's XSS defence).
  # A pull request bumps package.json only; copy the new files as static/vendor/LICENSES.txt
  # describes, or the version check in src/web/assets.rs fails.
  - package-ecosystem: npm
    directory: /static/vendor
    schedule:
      interval: weekly
