[package]
name = "discord-discussion-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
anyhow = "1"
# Web UI: only HTTP/1 (Caddy terminates TLS and HTTP/2), JSON and query extraction.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Randomness, SHA-256 and constant-time comparison; already built for rustls.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
wiremock = "0.6"

[profile.release]
strip = true
# This is an I/O-bound service. Keep serenity compilation within modest memory budgets.
opt-level = 1
codegen-units = 16

# Optimising serenity needs about 900 MB, which the 1 GB production VM (which builds the image)
# cannot provide next to the live bot and database. Its work is I/O-bound, so it is built
# unoptimised; every other crate keeps opt-level 1.
[profile.release.package.serenity]
opt-level = 0

[profile.dev]
debug = 0
